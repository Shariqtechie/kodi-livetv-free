name: Bug report
description: Something isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! The fastest way for us to fix this is the built-in log export:
        **Add-on settings → Troubleshooting → Turn on "Debug logging", reproduce the problem, then "Export log to folder"**, and attach the file below.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Kodi version and platform
      placeholder: "Kodi 21.3, Windows 11"
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country you selected
      placeholder: "India"
  - type: textarea
    id: log
    attributes:
      label: Exported log
      description: Drag and drop the exported .txt file here.
